<svg xmlns="http://www.w3.org/2000/svg" width="640" height="700" viewBox="0 0 640 700" role="img" aria-labelledby="title desc" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title id="title">GDP 到个人可支配收入的换算</title>
  <desc id="desc">GDP 扣折旧得到 NDP，扣间接税得到按要素成本计量的 NI；再扣社会保险缴款、公司所得税和未分配利润，加转移支付得到 PI；扣个人所得税得到 DPI。假定国外净要素收入为零，不考虑生产补贴等调整。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#23845a"/></marker>
  </defs>
  <rect width="640" height="700" rx="12" fill="#faf9f5"/>
  <text x="320" y="29" text-anchor="middle" font-size="13" fill="#62635d">假定国外净要素收入为零，忽略生产补贴等调整</text>
  <g fill="#e8f4ee" stroke="#a4cdb7" stroke-width="1.2">
    <rect x="110" y="48" width="420" height="58" rx="8"/>
    <rect x="110" y="170" width="420" height="58" rx="8"/>
    <rect x="110" y="292" width="420" height="58" rx="8"/>
    <rect x="110" y="484" width="420" height="58" rx="8"/>
    <rect x="110" y="606" width="420" height="58" rx="8"/>
  </g>
  <g fill="#1a6645" font-size="20" font-weight="600" text-anchor="middle">
    <text x="320" y="84">GDP　国内生产总值</text>
    <text x="320" y="206">NDP　国内生产净值</text>
    <text x="320" y="328">NI　国民收入（要素成本）</text>
    <text x="320" y="520">PI　个人收入</text>
    <text x="320" y="642">DPI　个人可支配收入</text>
  </g>
  <g stroke="#23845a" stroke-width="2" marker-end="url(#arrow)">
    <line x1="146" y1="113" x2="146" y2="158"/>
    <line x1="146" y1="235" x2="146" y2="280"/>
    <line x1="146" y1="357" x2="146" y2="472"/>
    <line x1="146" y1="549" x2="146" y2="594"/>
  </g>
  <g font-size="17" fill="#424740">
    <text x="180" y="142">− 折旧</text>
    <text x="180" y="264">− 间接税</text>
    <text x="180" y="382">− 社会保险缴款</text>
    <text x="180" y="410">− 公司所得税</text>
    <text x="180" y="438">− 公司未分配利润</text>
    <text x="180" y="466" fill="#1a6645">＋ 转移支付</text>
    <text x="180" y="578">− 个人所得税</text>
  </g>
  <text x="320" y="687" text-anchor="middle" font-size="14" fill="#62635d">DPI 用于消费与储蓄：DPI = C + S</text>
</svg>
