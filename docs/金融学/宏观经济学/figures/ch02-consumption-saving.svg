<svg xmlns="http://www.w3.org/2000/svg" width="640" height="690" viewBox="0 0 640 690" role="img" aria-labelledby="title desc" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <title id="title">消费函数与储蓄函数</title>
  <desc id="desc">消费为 100 加 0.8 倍可支配收入，储蓄为负 100 加 0.2 倍可支配收入。可支配收入为 500 时，消费与收入相等，储蓄为零；低于 500 时为负储蓄，高于 500 时为正储蓄。</desc>
  <rect width="640" height="690" rx="12" fill="#faf9f5"/>
  <g fill="#283d33" font-size="19" font-weight="600">
    <text x="85" y="38">消费：C = 100 + 0.8Y<tspan baseline-shift="sub" font-size="13">d</tspan></text>
    <text x="85" y="365">储蓄：S = −100 + 0.2Y<tspan baseline-shift="sub" font-size="13">d</tspan></text>
  </g>
  <g stroke="#747d75" stroke-width="1.5" fill="none">
    <path d="M85 68 V270 H558 M85 68 l-4 9 M85 68 l4 9 M558 270 l-9 -4 M558 270 l-9 4"/>
    <path d="M85 405 V620 M85 520 H558 M85 405 l-4 9 M85 405 l4 9 M558 520 l-9 -4 M558 520 l-9 4"/>
  </g>
  <g stroke="#a3aaa3" stroke-width="1.5" stroke-dasharray="6 5" fill="none">
    <path d="M85 270 L535 90"/>
    <path d="M85 180 H310 V270"/>
    <path d="M310 405 V620"/>
  </g>
  <path d="M85 252 L535 108" fill="none" stroke="#23845a" stroke-width="3"/>
  <path d="M85 600 L535 440" fill="none" stroke="#23845a" stroke-width="3"/>
  <g fill="#23845a"><circle cx="310" cy="180" r="5"/><circle cx="310" cy="520" r="5"/></g>
  <g fill="#535c54" font-size="16">
    <text x="62" y="65">C</text><text x="568" y="276">Y<tspan baseline-shift="sub" font-size="11">d</tspan></text>
    <text x="63" y="293">0</text><text x="39" y="257">100</text><text x="39" y="185">500</text>
    <text x="294" y="296">500</text><text x="515" y="296">1000</text>
    <text x="455" y="80">C = Y<tspan baseline-shift="sub" font-size="11">d</tspan></text>
    <text x="478" y="145" fill="#1a6645">消费线</text>
    <text x="62" y="402">S</text><text x="568" y="526">Y<tspan baseline-shift="sub" font-size="11">d</tspan></text>
    <text x="63" y="542">0</text><text x="28" y="605">−100</text>
    <text x="292" y="545">500</text><text x="514" y="545">1000</text>
    <text x="133" y="560">负储蓄</text><text x="405" y="450">正储蓄</text>
    <text x="330" y="578" fill="#1a6645">收支相抵点</text>
  </g>
  <text x="320" y="661" text-anchor="middle" font-size="16" fill="#535c54">消费等于收入时，储蓄为零；两图的相抵收入均为 500</text>
</svg>
