<svg xmlns="http://www.w3.org/2000/svg" width="400" height="172" viewBox="0 0 400 172" role="img" aria-label="IS 与 LM 的沿线机制">
<style>:root{--paper:#fff;--ink:#46564c;--muted:#69766c;--green:#416f5d;--ochre:#ad7c51;--ochre-text:#96643e;--axis:#939f97;--guide:#e0e6e1;--old-is:#82998b;--old-lm:#a48d79;--old-point:#718078;--curve-width:1.8;--axis-width:.85;--guide-width:.75;--label-size:15px;--tick-size:13px;}
text{font-family:'Microsoft YaHei','PingFang SC',sans-serif;fill:var(--ink);font-size:15px;font-variant-numeric:tabular-nums;}path{fill:none;}.heading{font-size:17px;}.region{fill:var(--muted);font-size:13px;}</style>
<rect width="400" height="172" fill="white"/><text x="18" y="43" style="font-weight:600;fill:var(--green)">IS</text><text x="85" y="43" text-anchor="middle">r↓</text><text x="151" y="43" text-anchor="middle">I↑</text><text x="118.0" y="43" text-anchor="middle" style="fill:var(--muted)">→</text><text x="245" y="43" text-anchor="middle">S↑</text><text x="190.0" y="43" text-anchor="middle" style="fill:var(--muted)">→</text><text x="350" y="43" text-anchor="middle">Y↑</text><text x="309.5" y="43" text-anchor="middle" style="fill:var(--muted)">→</text><text x="85" y="66" style="font-size:12px;fill:var(--muted)">其他条件不变</text><text x="18" y="119" style="font-weight:600;fill:var(--ochre-text)">LM</text><text x="85" y="119" text-anchor="middle">Y↑</text><text x="216" y="119" text-anchor="middle">L₁↑</text><text x="150.5" y="119" text-anchor="middle" style="fill:var(--muted)">→</text><text x="350" y="119" text-anchor="middle">r↑</text><text x="283.0" y="119" text-anchor="middle" style="fill:var(--muted)">→</text><text x="85" y="142" style="font-size:12px;fill:var(--muted)">M 固定</text></svg>