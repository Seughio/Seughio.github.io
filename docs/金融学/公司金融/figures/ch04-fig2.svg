<?xml version="1.0" encoding="UTF-8"?>
<svg aria-label="2×2 结构：左列金额不变右列按 g 增长，上行永不到期下行共 T 期" role="img" viewbox="0 0 600 210" xmlns="http://www.w3.org/2000/svg">
<title>四种简化形态的谱系：永续、增长永续、年金、增长年金</title>
<text fill="#7d848e" font-family="Microsoft YaHei, sans-serif" font-size="9" text-anchor="middle" x="165" y="22">金额不变</text>
<text fill="#7d848e" font-family="Microsoft YaHei, sans-serif" font-size="9" text-anchor="middle" x="435" y="22">按 g 增长</text>
<text fill="#7d848e" font-family="Microsoft YaHei, sans-serif" font-size="9" text-anchor="end" x="62" y="68">永不到期</text>
<text fill="#7d848e" font-family="Microsoft YaHei, sans-serif" font-size="9" text-anchor="end" x="62" y="158">共 T 期</text>
<rect fill="#0f5c56" height="58" opacity="0.06" rx="3" width="190" x="70" y="36"></rect>
<rect fill="none" height="58" rx="3" stroke="#0f5c56" stroke-width="1.1" width="190" x="70" y="36"></rect>
<text fill="#7d848e" font-family="Microsoft YaHei, sans-serif" font-size="8.5" text-anchor="middle" x="165" y="51">永续</text>
<text fill="#0f5c56" font-family="Georgia, serif" font-size="10.5" text-anchor="middle" x="165" y="70">C / r</text>
<text fill="#9c9585" font-family="Microsoft YaHei, sans-serif" font-size="8.5" text-anchor="middle" x="165" y="86">每期 C，永远</text>
<rect fill="#8a6a2f" height="58" opacity="0.06" rx="3" width="190" x="340" y="36"></rect>
<rect fill="none" height="58" rx="3" stroke="#8a6a2f" stroke-width="1.1" width="190" x="340" y="36"></rect>
<text fill="#7d848e" font-family="Microsoft YaHei, sans-serif" font-size="8.5" text-anchor="middle" x="435" y="51">增长永续</text>
<text fill="#0f5c56" font-family="Georgia, serif" font-size="10.5" text-anchor="middle" x="435" y="70">C / (r − g)</text>
<text fill="#9c9585" font-family="Microsoft YaHei, sans-serif" font-size="8.5" text-anchor="middle" x="435" y="86">每期涨 g，永远</text>
<rect fill="#0f5c56" height="58" opacity="0.06" rx="3" width="190" x="70" y="126"></rect>
<rect fill="none" height="58" rx="3" stroke="#0f5c56" stroke-width="1.1" width="190" x="70" y="126"></rect>
<text fill="#7d848e" font-family="Microsoft YaHei, sans-serif" font-size="8.5" text-anchor="middle" x="165" y="141">年金</text>
<text fill="#0f5c56" font-family="Georgia, serif" font-size="10.5" text-anchor="middle" x="165" y="160">(C/r) × [1 − 1/(1+r)ᵀ]</text>
<text fill="#9c9585" font-family="Microsoft YaHei, sans-serif" font-size="8.5" text-anchor="middle" x="165" y="176">每期 C，共 T 期</text>
<rect fill="#8a6a2f" height="58" opacity="0.06" rx="3" width="190" x="340" y="126"></rect>
<rect fill="none" height="58" rx="3" stroke="#8a6a2f" stroke-width="1.1" width="190" x="340" y="126"></rect>
<text fill="#7d848e" font-family="Microsoft YaHei, sans-serif" font-size="8.5" text-anchor="middle" x="435" y="141">增长年金</text>
<text fill="#0f5c56" font-family="Georgia, serif" font-size="10.5" text-anchor="middle" x="435" y="160">(C/(r − g)) × [1 − ((1+g)/(1+r))ᵀ]</text>
<text fill="#9c9585" font-family="Microsoft YaHei, sans-serif" font-size="8.5" text-anchor="middle" x="435" y="176">每期涨 g，共 T 期</text>
<path d="M 264.0 74.0 L 329.0 74.0" fill="none" stroke="#9c3d2e" stroke-width="1.1"></path>
<path d="M 334.0 74.0 L 329.0 76.4 L 329.0 71.6 Z" fill="#9c3d2e"></path>
<text fill="#9c3d2e" font-family="Microsoft YaHei, sans-serif" font-size="8" text-anchor="middle" x="299" y="63">分母 r → r − g</text>
<path d="M 165.0 98.0 L 165.0 116.0" fill="none" stroke="#9c3d2e" stroke-width="1.1"></path>
<path d="M 165.0 121.0 L 162.6 116.0 L 167.4 116.0 Z" fill="#9c3d2e"></path>
<text fill="#9c3d2e" font-family="Microsoft YaHei, sans-serif" font-size="8" x="173" y="114">减掉 T 之后那段</text>
</svg>
